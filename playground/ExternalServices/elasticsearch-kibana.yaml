# Single-node Elasticsearch + Kibana for local Aspire development.
# Replace the Secret password placeholder before applying.
# Sign in with "elastic"; Kibana uses "kibana_system" internally with the same password.
# Requires a default StorageClass. If the PVC has old unsecured data, recreate it or reset the built-in passwords.
# kubectl apply -f playground/ExternalServices/elasticsearch-kibana.yaml
# kubectl delete -f playground/ExternalServices/elasticsearch-kibana.yaml
# kubectl port-forward -n default svc/kibana 5601:5601
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-credentials
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
type: Opaque
stringData:
  password: "<replace-with-elastic-password>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
data:
  elasticsearch.yml: |
    cluster.name: aspire
    node.name: elasticsearch
    discovery.type: single-node
    network.host: 0.0.0.0
    xpack.security.enabled: true
    xpack.ml.enabled: false
    xpack.monitoring.collection.enabled: false
    ingest.geoip.downloader.enabled: false
    node.store.allow_mmap: false
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: aspire
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: elasticsearch:8.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: ES_JAVA_OPTS
              value: -Xms2g -Xmx2g
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: 1
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: elasticsearch-config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: elasticsearch-config
          configMap:
            name: elasticsearch-config
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: aspire
data:
  kibana.yml: |
    server.port: 5601
    server.host: 0.0.0.0
    server.shutdownTimeout: "5s"
    elasticsearch.hosts: ["http://elasticsearch:9200"]
    elasticsearch.username: ${ELASTICSEARCH_USERNAME}
    elasticsearch.password: ${ELASTICSEARCH_PASSWORD}
    elasticsearch.ssl.verificationMode: none
    monitoring.ui.container.elasticsearch.enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: aspire
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: aspire
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: aspire
    spec:
      initContainers:
        - name: configure-kibana-system-password
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            - name: KIBANA_SYSTEM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              until [ "$(curl -s -o /dev/null -w '%{http_code}' -u "elastic:${ELASTIC_PASSWORD}" http://elasticsearch:9200/_security/_authenticate)" = "200" ]; do
                sleep 5
              done

              status_code="$(curl -s -o /tmp/set-kibana-system-password-response.txt -w '%{http_code}' \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -H "Content-Type: application/json" \
                -X POST "http://elasticsearch:9200/_security/user/kibana_system/_password" \
                -d "{\"password\":\"${KIBANA_SYSTEM_PASSWORD}\"}")"

              if [ "${status_code}" != "200" ] && [ "${status_code}" != "204" ]; then
                cat /tmp/set-kibana-system-password-response.txt
                exit 1
              fi
      containers:
        - name: kibana
          image: kibana:8.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
            - name: ELASTICSEARCH_USERNAME
              value: kibana_system
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: kibana-config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
      volumes:
        - name: kibana-config
          configMap:
            name: kibana-config
