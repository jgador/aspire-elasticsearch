# Cost-optimized single-node Elasticsearch + Kibana reference for Aspire development/testing.
# This provisions Elasticsearch and Kibana only. Connecting Aspire Dashboard or other apps to this
# instance is a separate concern.
# Assumes the cluster has a default StorageClass. If it does not, set
# storageClassName on the PVC below before applying.
# Replace the placeholder credential values in the Secret below before applying.
# For the minimal built-in-user setup, set the username to "elastic" unless you provision
# a different Elasticsearch user separately.
# If this PVC already contains data from an unsecured cluster, recreate the PVC for a fresh
# dev setup or reset the built-in user password after enabling security.
# Apply with:
# kubectl apply -f playground/ExternalServices/elasticsearch-kibana.yaml
# Remove with:
# kubectl delete -f playground/ExternalServices/elasticsearch-kibana.yaml
# Access Kibana locally with:
# kubectl port-forward -n default svc/kibana 5601:5601
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: elasticsearch-credentials
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
type: Opaque
stringData:
  username: "<replace-with-elastic-username>"
  password: "<replace-with-elastic-password>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
data:
  elasticsearch.yml: |
    cluster.name: aspire
    node.name: elasticsearch
    discovery.type: single-node
    network.host: 0.0.0.0
    xpack.security.enabled: true
    xpack.ml.enabled: false
    xpack.monitoring.collection.enabled: false
    ingest.geoip.downloader.enabled: false
    node.store.allow_mmap: false
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: default
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: aspire
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: aspire
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: elasticsearch:8.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9200
          env:
            - name: ES_JAVA_OPTS
              value: -Xms2g -Xmx2g
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: 1
              memory: 4Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: elasticsearch-config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: elasticsearch-config
          configMap:
            name: elasticsearch-config
        - name: elasticsearch-data
          persistentVolumeClaim:
            claimName: elasticsearch-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: aspire
data:
  kibana.yml: |
    server.port: 5601
    server.host: 0.0.0.0
    server.shutdownTimeout: "5s"
    elasticsearch.hosts: ["http://elasticsearch:9200"]
    elasticsearch.username: ${ELASTICSEARCH_USERNAME}
    elasticsearch.password: ${ELASTICSEARCH_PASSWORD}
    elasticsearch.ssl.verificationMode: none
    monitoring.ui.container.elasticsearch.enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: aspire
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - name: http
      port: 5601
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: default
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/part-of: aspire
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
        app.kubernetes.io/part-of: aspire
    spec:
      containers:
        - name: kibana
          image: kibana:8.17.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=512
            - name: ELASTICSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: username
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: kibana-config
              mountPath: /usr/share/kibana/config/kibana.yml
              subPath: kibana.yml
      volumes:
        - name: kibana-config
          configMap:
            name: kibana-config
